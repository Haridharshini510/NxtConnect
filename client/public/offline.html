<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextConnect Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at top, #1e3a8a, #0f172a 65%);
        color: #e2e8f0;
      }
      .card {
        width: min(92vw, 420px);
        border: 1px solid #334155;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.8);
        padding: 28px;
        text-align: center;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 10px 0 8px;
        font-size: 1.4rem;
      }
      p {
        margin: 0 0 18px;
        color: #cbd5e1;
        line-height: 1.4;
      }
      .dot {
        width: 56px;
        height: 56px;
        border-radius: 999px;
        margin: 0 auto 8px;
        background: linear-gradient(135deg, #38bdf8, #22c55e);
      }
      button {
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot"></div>
      <h1>You're offline</h1>
      <p>NextConnect will reconnect automatically. You can retry when your internet is back.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
